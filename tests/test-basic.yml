name: Test basic usage (default max-commits, no push)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Record commit count before action
        id: before
        run: |
          COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "0")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Before count: $COUNT"

      - id: action
        uses: .
        with:
          max-commits: '3'
          include-push: 'false'

      - name: Assert commits were made
        env:
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          AFTER=$(git rev-list --count HEAD 2>/dev/null || echo "0")
          echo "commits before: $BEFORE"
          echo "commits after:  $AFTER"
          DIFF=$((AFTER - BEFORE))
          echo "new commits: $DIFF"
          if [ "$DIFF" -lt 1 ]; then
            echo "FAIL: expected at least 1 new commit, got $DIFF"
            exit 1
          fi
          if [ "$DIFF" -gt 3 ]; then
            echo "FAIL: expected at most 3 new commits (max-commits=3), got $DIFF"
            exit 1
          fi
          echo "PASS: $DIFF new commit(s) made"

      - name: Assert changes.txt was created
        run: |
          if [ ! -f changes.txt ]; then
            echo "FAIL: changes.txt was not created"
            exit 1
          fi
          echo "PASS: changes.txt exists"
          cat changes.txt
