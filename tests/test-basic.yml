name: Test basic usage (default max-commits, no push)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity before action runs
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Record commit count before action
        id: before
        run: echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        with:
          max-commits: '3'
          include-push: 'false'

      - name: Assert changes.txt was created
        run: |
          if [ ! -f changes.txt ]; then
            echo "FAIL: changes.txt was not created"
            exit 1
          fi
          echo "PASS: changes.txt exists"

      - name: Assert commits were made
        env:
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          AFTER=$(git rev-list --count HEAD)
          echo "commits before: $BEFORE"
          echo "commits after:  $AFTER"
          ADDED=$((AFTER - BEFORE))
          echo "commits added: $ADDED"
          if [ "$ADDED" -lt 1 ]; then
            echo "FAIL: expected at least 1 new commit, got $ADDED"
            exit 1
          fi
          if [ "$ADDED" -gt 3 ]; then
            echo "FAIL: expected at most 3 new commits (max-commits=3), got $ADDED"
            exit 1
          fi
          echo "PASS: $ADDED commit(s) added (within 1..3 range)"
